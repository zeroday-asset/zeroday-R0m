name: Build N986B source TWRP
on:
  push:
    branches: [c2s-recovery-source]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c2s-source-recovery
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: target/c2s/recovery
      - name: Prepare recovery build tools and space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache clang cpio curl flex g++-multilib git gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev libbz2-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libssl-dev libxml2-utils lld lzop openjdk-11-jdk-headless python-is-python3 python3 rsync schedtool unzip xsltproc zip zlib1g-dev
          git config --global user.email github-actions[bot]@users.noreply.github.com
          git config --global user.name github-actions[bot]
          echo "C2S_RECOVERY_KERNEL=$RUNNER_TEMP/c2s-recovery-kernel" >> "$GITHUB_ENV"
          echo "C2S_TWRP_TREE=$RUNNER_TEMP/twrp" >> "$GITHUB_ENV"
          sudo fallocate -l 8G /mnt/twrp-swap
          sudo chmod 600 /mnt/twrp-swap
          sudo mkswap /mnt/twrp-swap
          sudo swapon /mnt/twrp-swap
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: kernel-cache
        with:
          path: ${{ env.C2S_RECOVERY_KERNEL }}
          key: c2s-recovery-kernel-v1-${{ hashFiles('target/c2s/recovery/build-kernel.sh') }}
      - name: Compile a separate recovery-only kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: bash target/c2s/recovery/build-kernel.sh "$C2S_RECOVERY_KERNEL"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.C2S_RECOVERY_KERNEL }}
          key: c2s-recovery-kernel-v1-${{ hashFiles('target/c2s/recovery/build-kernel.sh') }}
      - name: Sync TWRP source
        run: |
          curl -fLsS --retry 3 https://storage.googleapis.com/git-repo-downloads/repo -o "$RUNNER_TEMP/repo"
          chmod +x "$RUNNER_TEMP/repo"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          mkdir -p "$C2S_TWRP_TREE"
          cd "$C2S_TWRP_TREE"
          "$RUNNER_TEMP/repo" init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b 6dc117d9cbd08430daa16db2013560e1c4017fa8 --no-clone-bundle
          for attempt in 1 2 3; do
            "$RUNNER_TEMP/repo" sync -c -j4 --no-tags --no-clone-bundle --force-sync --fail-fast && break
            test "$attempt" -lt 3 || exit 1
          done
          df -h .
      - name: Build and inspect c2s TWRP
        run: bash target/c2s/recovery/build-recovery.sh "$C2S_TWRP_TREE" "$C2S_RECOVERY_KERNEL" "$GITHUB_WORKSPACE/dist"
      - name: Upload source-built recovery package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: N986B-source-TWRP-r1-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0

